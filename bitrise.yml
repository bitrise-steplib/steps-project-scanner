format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: step-metadata.bitrise.yml
- repository: steps-check
  branch: master
  path: golang.bitrise.yml

app:
  envs:
  # define these in your .bitrise.secrets.yml
  - BITRISE_SCAN_RESULT_POST_URL: $BITRISE_SCAN_RESULT_POST_URL
  - BITRISE_APP_API_TOKEN: $BITRISE_APP_API_TOKEN

workflows:
  # ----------------------------------------------------------------
  # --- workflow to Step Test
  sample:
    envs:
    # Define your local project's root directory here
    - PROJECT_DIR: <local_project_dir>
    steps:
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $PROJECT_DIR
        - scan_result_submit_url: path::./_scan_result/scan_result.json
        - scan_result_submit_api_token: ""

  test:
    after_run:
    - test_repo_clone
    title: Bitrise Init Test
    description: Bitrise Init Test
    envs:
    - CLONE_INTO_DIR: _tmp
    - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR
    steps:
    - script:
        title: yamlfmt
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail
            set -x

            # TODO: deviates from the step-repo convention on purpose. bundle::yamlfmt only
            # reformats and leaves autofix-ci to commit the result, which needs Unified CI, so
            # here it could never fail. Lint instead until this Step migrates, then switch back.
            ymlfmt_conf="$(mktemp)"
            curl -sSfL -o "$ymlfmt_conf" https://raw.githubusercontent.com/bitrise-steplib/steps-check/refs/heads/master/.ymlfmt
            go run github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0 -lint -conf "$ymlfmt_conf" -match_type doublestar -exclude "_tmp/**,.bitrise.secrets.yml,.git/**,.github/**,vendor/**" '**/*.yml'
    - bundle::step-yml-audit: {}
    - script:
        title: Check README.md is consistent with step.yml
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail

            bitrise run generate_readme

            # `git diff` only compares tracked paths, so a commit that deletes README.md would
            # pass: the generator recreates it as an untracked file and the diff stays empty.
            # `git status --porcelain` reports `??` for that case as well as `M` for drift.
            if [ -n "$(git status --porcelain -- README.md)" ]; then
              echo "README.md is out of date or untracked; run 'bitrise run generate_readme' and commit the result."
              git status --short -- README.md
              exit 1
            fi
    - bundle::golangci-lint:
        inputs:
        - golangci_lint_version: 2.11.4
    - bundle::go-test: {}
    - script:
        title: "Scan test: ios-no-shared-schemes"
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $ORIG_BITRISE_SOURCE_DIR/_tmp
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-samples/ios-no-shared-schemes.git
            git clone $SAMPLE_APP_REPOSITORY_URL $CLONE_INTO_DIR
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN
    - script:
        title: "Scan test: sample-apps-ios-simple-objc"
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $CLONE_INTO_DIR
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-io/sample-apps-ios-simple-objc.git
            git clone $SAMPLE_APP_REPOSITORY_URL $CLONE_INTO_DIR
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN
    - script:
        title: "Scan test: sample-apps-android-sdk22"
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $CLONE_INTO_DIR
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-samples/sample-apps-android-sdk22.git
            git clone $SAMPLE_APP_REPOSITORY_URL ./_tmp/sample-repo
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN
    - script:
        title: "Scan test: sample-apps-ios-watchkit"
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $CLONE_INTO_DIR
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-io/sample-apps-ios-watchkit.git
            git clone $SAMPLE_APP_REPOSITORY_URL ./_tmp/sample-repo
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN
    - script:
        title: "Scanner test: fastlane"
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $CLONE_INTO_DIR
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-samples/fastlane.git
            git clone $SAMPLE_APP_REPOSITORY_URL $CLONE_INTO_DIR
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN
    - script:
        title: "Scan test: android-non-executable-gradlew"
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $CLONE_INTO_DIR
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-samples/android-non-executable-gradlew.git
            git clone $SAMPLE_APP_REPOSITORY_URL $CLONE_INTO_DIR
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN

  test_repo_clone:
    envs:
    - CLONE_INTO_DIR: _tmp
    - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR
    steps:
    - script:
        title: Scan test built in repo clone
        inputs:
        - content: |-
            #!/bin/bash
            set -x

            rm -rf $CLONE_INTO_DIR
            mkdir $CLONE_INTO_DIR
            SAMPLE_APP_REPOSITORY_URL=https://github.com/bitrise-io/sample-apps-ios-simple-objc.git
            envman add --key SAMPLE_APP_REPOSITORY_URL --value $SAMPLE_APP_REPOSITORY_URL
    - path::./:
        title: Step Test
        inputs:
        - scan_dir: $CLONE_INTO_DIR
        - output_dir: $ORIG_BITRISE_SOURCE_DIR/result
        - scan_result_submit_url: $BITRISE_SCAN_RESULT_POST_URL
        - scan_result_submit_api_token: $BITRISE_APP_API_TOKEN
        - enable_repo_clone: "yes"
        - repository_url: $SAMPLE_APP_REPOSITORY_URL
        - branch: master

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: {}
